# SCRUM-61 Render 무료 서버는 15분 동안 요청이 없으면 잠들어요. 10분마다 깨워 둬요.
# 예약 실행은 기본 브랜치(main)에 있는 이 파일로만 돌아요.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # Actions 탭에서 손으로도 실행할 수 있어요

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://gourmand-api.onrender.com/health
