# PR · develop/main 에 올라오면 테스트를 자동으로 돌려요
# backend: pytest (Postgres) · frontend: lint · tsc · Vitest · e2e: 백엔드 + 빌드한 프론트 + Playwright
name: test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency: # 같은 브랜치에 새로 올리면 이전 실행은 취소
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gourmand
  JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-bytes-long

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gourmand
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gourmand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gourmand/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gourmand
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gourmand/package-lock.json

      - name: 백엔드 (마이그레이션 · 시드 · 서버)
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run alembic upgrade head
          uv run python scripts/seed.py
          nohup uv run uvicorn main:app --app-dir src --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health

      - name: 프론트 빌드
        working-directory: gourmand
        run: |
          npm ci
          npm run build

      - name: Playwright
        working-directory: gourmand
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e

      - name: 실패하면 리포트 · 백엔드 로그 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            gourmand/playwright-report/
            backend.log
          retention-days: 7
